<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistance technique de StarMint App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }
        body {
            background-color: #f7f8fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 48px 36px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #222831;
            font-size: 26px;
            margin-bottom: 24px;
        }
        .email-text {
            font-size: 18px;
            color: #007aff;
            font-weight: 500;
            margin:12px 0 28px;
        }
        .desc {
            color:#555;
            font-size:15px;
        }
    </style>
</head>
<body>
<div class="card">
    <h1>Assistance technique de StarMint App</h1>
    <p>Pour signaler des bugs ou obtenir de l'aide à l'utilisation :</p>
    <p class="email-text">daoyingfanchen123@icloud.com</p>
    <p class="desc">Nous répondons sous 24 heures ouvrables.</p>
</div>
</body>
</html>
